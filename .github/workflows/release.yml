name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate extension icons
        run: npm run icons

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test

      - name: Build Chrome MV3 extension
        run: npm run build

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package extension zip bundles
        run: |
          npm run zip
          npm run zip:firefox

      - name: Publish GitHub Release and Attach Packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
