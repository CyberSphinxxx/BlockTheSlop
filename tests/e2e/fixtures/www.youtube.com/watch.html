<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FixtureTube — Watch</title>
  </head>
  <body>
    <h1>Watching: The history of bread</h1>
    <main>
      <div id="secondary">
        <ytd-compact-video-renderer data-testid="sidebar-human">
          <a
            id="video-title-link"
            href="/watch?v=sidehum04"
            aria-label="Ancient baking methods by History Corner"
          >
            <span id="video-title">Ancient baking methods</span>
          </a>
          <div id="channel-name"><a href="/channel/UCHuman1111111111111111">History Corner</a></div>
        </ytd-compact-video-renderer>
        <ytd-compact-video-renderer data-testid="sidebar-disclosure">
          <a
            id="video-title-link"
            href="/watch?v=sidedisc05"
            aria-label="Atlantis revealed by Past Reimagined"
          >
            <span id="video-title">Atlantis revealed</span>
          </a>
          <div id="channel-name"><a href="/@pastreimagined">Past Reimagined</a></div>
          <div class="badges">
            <span class="badge badge-shape-wiz__text">Altered or synthetic content</span>
          </div>
        </ytd-compact-video-renderer>
      </div>
    </main>
  </body>
</html>
