<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FixtureTube — Home</title>
  </head>
  <body>
    <h1>FixtureTube Home</h1>
    <main id="contents">
      <yt-lockup-view-model data-testid="card-human">
        <a
          id="video-title-link"
          href="/watch?v=human100"
          aria-label="The history of bread by History Corner"
        >
          <span id="video-title">The history of bread</span>
        </a>
        <div id="channel-name"><a href="/channel/UCHuman1111111111111111">History Corner</a></div>
        <span class="yt-lockup-metadata-view-model__text-wrapper">12K views</span>
      </yt-lockup-view-model>

      <yt-lockup-view-model data-testid="card-disclosure">
        <a
          id="video-title-link"
          href="/watch?v=disclosed200"
          aria-label="Rome retold by Past Reimagined"
        >
          <span id="video-title">Rome retold</span>
        </a>
        <div id="channel-name"><a href="/@pastreimagined">Past Reimagined</a></div>
        <div class="badges">
          <span class="badge badge-shape-wiz__text">Altered or synthetic content</span>
        </div>
      </yt-lockup-view-model>

      <yt-lockup-view-model data-testid="card-discussion">
        <a
          id="video-title"
          href="/watch?v=discussion300"
          aria-label="Why AI slop is taking over YouTube by Tech Explained"
        >
          <span id="video-title">Why AI slop is taking over YouTube</span>
        </a>
        <div id="channel-name"><a href="/channel/UCTech3333333333333333">Tech Explained</a></div>
      </yt-lockup-view-model>

      <ytm-shorts-lockup-view-model data-testid="card-short">
        <a href="/shorts/shortfix01" aria-label="Quick recipe hack"></a>
        <span class="title">Quick recipe hack</span>
      </ytm-shorts-lockup-view-model>
    </main>
  </body>
</html>
