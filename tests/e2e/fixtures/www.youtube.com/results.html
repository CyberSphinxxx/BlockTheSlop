<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FixtureTube — Search</title>
  </head>
  <body>
    <h1>Search results</h1>
    <main id="contents">
      <yt-lockup-view-model data-testid="card-search-human">
        <a
          id="video-title"
          href="/watch?v=searchhum01"
          aria-label="Documentary: mountains of the world by Nature Docs"
        >
          <span id="video-title">Documentary: mountains of the world</span>
        </a>
        <div id="channel-name"><a href="/channel/UCNat5555555555555555">Nature Docs</a></div>
      </yt-lockup-view-model>
      <yt-lockup-view-model data-testid="card-search-disclosure">
        <a id="video-title" href="/watch?v=searchdisc02" aria-label="Ocean dreams by Dream Machine">
          <span id="video-title">Ocean dreams</span>
        </a>
        <div id="channel-name"><a href="/@dreammachine">Dream Machine</a></div>
        <div class="badges">
          <span class="badge badge-shape-wiz__text">Altered or synthetic content</span>
        </div>
      </yt-lockup-view-model>
    </main>
  </body>
</html>
