<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FixtureTube — Subscriptions</title>
  </head>
  <body>
    <h1>Subscriptions</h1>
    <main id="contents">
      <yt-lockup-view-model data-testid="card-sub-human">
        <a
          id="video-title-link"
          href="/watch?v=subhum06"
          aria-label="Handmade ceramics by Craft House"
        >
          <span id="video-title">Handmade ceramics</span>
        </a>
        <div id="channel-name"><a href="/channel/UCCraft77777777777777">Craft House</a></div>
      </yt-lockup-view-model>
      <yt-lockup-view-model data-testid="card-sub-disclosure">
        <a
          id="video-title-link"
          href="/watch?v=subdisc07"
          aria-label="Sleep stories by Sleepy AI Tales"
        >
          <span id="video-title">Sleep stories</span>
        </a>
        <div id="channel-name"><a href="/@sleepyaitales">Sleepy AI Tales</a></div>
        <div class="badges">
          <span class="badge badge-shape-wiz__text">Altered or synthetic content</span>
        </div>
      </yt-lockup-view-model>
    </main>
  </body>
</html>
